name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employee_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/employee_db
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Check generated WAR
        run: |
          ls -lh target/*.war

      - name: Rename WAR
        run: |
          cp target/*.war target/ROOT.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-backend-war
          path: target/ROOT.war


  deploy:
    name: Deploy to EC2
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: employee-backend-war
          path: dist

      - name: Create SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy WAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            dist/ROOT.war \
            "$EC2_USER@$EC2_HOST:/tmp/ROOT.war"

      - name: Deploy to Tomcat
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" << 'EOF'

          set -e

          echo "Stopping Tomcat..."
          sudo systemctl stop tomcat11

          echo "Removing old application..."
          sudo rm -f /var/lib/tomcat11/webapps/ROOT.war
          sudo rm -rf /var/lib/tomcat11/webapps/ROOT

          echo "Copying new WAR..."
          sudo cp /tmp/ROOT.war /var/lib/tomcat11/webapps/ROOT.war

          echo "Removing temporary WAR..."
          rm -f /tmp/ROOT.war

          echo "Starting Tomcat..."
          sudo systemctl start tomcat11

          echo "Checking Tomcat..."
          sudo systemctl is-active --quiet tomcat11

          echo "Deployment successful!"

          EOF
